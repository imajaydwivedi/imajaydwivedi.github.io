services:
  resume-tweaker:
    build:
      context: .
      args:
        WITH_DOC: "1"
    image: resume-tweaker:latest
    ports:
      - "8080:80"  # host 8080 -> container 80
    environment:
      MAX_UPLOAD_MB: "5"
      SESSION_TTL_MIN: "60"
      MAX_SUGGESTIONS: "30"
      LOG_LEVEL: "INFO"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
